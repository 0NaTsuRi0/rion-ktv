<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>璃音K歌 · 曲库管理</title>
<link rel="icon" href="/icons/favicon.svg">
<style>
:root{--bg:#07071a;--card:#10102a;--accent:#c736f7;--cyan:#36d9f7;--pink:#ff4f9b;--orange:#ff8c42;--text:#f4f4ff;--sub:#8888aa;--bar-h:44px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;padding-top:calc(var(--bar-h) + 4px);padding-bottom:20px}

/* header */
header{position:fixed;top:0;left:0;right:0;z-index:30;padding:6px 10px;background:rgba(7,7,26,.96);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:5px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
.logo{font-size:16px;font-weight:900;white-space:nowrap;background:linear-gradient(90deg,var(--cyan),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;flex-shrink:0}
header .spacer{flex:1;min-width:4px}
.hbtn{padding:5px 10px;border-radius:8px;font-size:11px;cursor:pointer;border:none;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);white-space:nowrap;flex-shrink:0;font-weight:500}
.hbtn.primary{background:linear-gradient(135deg,var(--accent),var(--cyan));border:none;color:#07071a;font-weight:600}
.hbtn.warn{background:linear-gradient(135deg,var(--orange),var(--pink));border:none;color:#fff;font-weight:600}
.hbtn.danger{background:linear-gradient(135deg,var(--pink),#cc2255);border:none;color:#fff;font-weight:600}

/* progress bar - floating below header */
#progress-bar{position:fixed;top:var(--bar-h);left:0;right:0;z-index:25;background:rgba(16,16,42,.96);backdrop-filter:blur(12px);padding:6px 12px;font-size:12px;color:var(--cyan);display:none;border-bottom:1px solid rgba(255,255,255,.06);line-height:1.4}
#progress-bar.show{display:block}
#progress-bar .pb-msg{display:flex;align-items:center;gap:8px}
#progress-bar .pb-spinner{width:14px;height:14px;border:2px solid var(--cyan);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* main */
main{max-width:900px;margin:0 auto;padding:10px 12px}

/* stats */
.stats-row{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:var(--card);border-radius:10px;padding:10px 8px;text-align:center;border:1px solid rgba(255,255,255,.05)}
.stat .n{font-size:22px;font-weight:800;color:var(--accent)}
.stat .l{font-size:10px;color:var(--sub);margin-top:1px}

/* toolbar */
.toolbar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:nowrap;align-items:stretch;position:sticky;top:calc(var(--bar-h) + 2px);z-index:20;background:var(--bg);padding:6px 0}
.search-box{flex:1;min-width:100px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border-radius:10px;padding:8px 10px;border:1px solid rgba(255,255,255,.08)}
.search-box input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:13px;min-width:0}
.toolbar .hbtn{font-size:11px;padding:5px 10px;height:auto}

/* upload zone */
#upload-zone{border:2px dashed rgba(255,255,255,.12);border-radius:12px;padding:16px;text-align:center;margin-bottom:10px;transition:.2s;cursor:pointer}
#upload-zone.drag{border-color:var(--accent);background:rgba(199,54,247,.08)}
#upload-zone .uz-icon{font-size:24px;margin-bottom:4px}
#upload-zone .uz-text{font-size:12px;color:var(--sub)}
#upload-zone .uz-types{font-size:10px;color:var(--sub);margin-top:2px}
#upload-progress{display:none;height:3px;background:var(--accent);border-radius:2px;margin-top:8px;transition:width .3s}

/* song list - compact card */
.song-card{display:flex;align-items:center;padding:8px 10px;background:var(--card);border-radius:10px;margin-bottom:5px;gap:8px;border:1px solid rgba(255,255,255,.04)}
.song-card .sc-cb{flex-shrink:0;width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.song-card .sc-img{width:30px;height:30px;border-radius:5px;object-fit:cover;flex-shrink:0}
.song-card .sc-info{flex:1;min-width:0;overflow:hidden}
.song-card .sc-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-card .sc-meta{font-size:10px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-card .sc-meta span{margin-right:6px}
.song-card .sc-acts{display:flex;gap:4px;flex-shrink:0;flex-wrap:nowrap}
.act-btn{padding:4px 8px;border-radius:6px;font-size:10px;border:none;cursor:pointer;white-space:nowrap}
.act-edit{background:rgba(54,217,247,.15);color:var(--cyan)}
.act-del{background:rgba(255,79,155,.15);color:var(--pink)}

/* modals */
#modal-overlay,#pw-modal-overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}
#modal-overlay.open,#pw-modal-overlay.open{display:flex}
#modal,#pw-modal{background:#12122e;border-radius:16px;padding:20px;width:360px;max-width:92vw;border:1px solid rgba(255,255,255,.1)}
#modal h3,#pw-modal h3{font-size:15px;margin-bottom:14px}
.form-row{margin-bottom:10px}
.form-row label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px}
.form-row input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:9px 12px;color:var(--text);font-size:13px;outline:none}
.form-row input:focus{border-color:var(--accent)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

/* toast */
#toast{position:fixed;top:calc(var(--bar-h) + 50px);left:50%;transform:translateX(-50%);background:rgba(20,20,50,.95);border:1px solid rgba(199,54,247,.4);padding:8px 18px;border-radius:10px;font-size:12px;z-index:99;transition:opacity .3s;opacity:0;pointer-events:none}
#toast.show{opacity:1}

.empty{text-align:center;color:#444;padding:30px 0;font-size:13px}

/* login */
#login-overlay{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center}
#login-overlay.hidden{display:none}
.auth-box{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:28px 20px;width:300px;max-width:90vw;text-align:center}
.auth-box .lg-title{font-size:17px;font-weight:800;margin-bottom:4px}
.auth-box .lg-sub{color:var(--sub);font-size:11px;margin-bottom:18px}
.auth-box input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;outline:none;margin-bottom:10px}
.auth-box input:focus{border-color:var(--accent)}
.auth-box button{width:100%;padding:10px;border-radius:10px;border:none;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--cyan));color:#07071a;font-size:13px}
#login-err,#setup-err,#pw-err{color:var(--pink);font-size:11px;margin:-2px 0 8px;min-height:12px}
.hidden{display:none !important}

/* mobile overrides */
@media(max-width:640px){
  body{padding-top:calc(var(--bar-h) + 2px)}
  header{padding:4px 6px;gap:4px}
  .logo{font-size:12px;display:none}
  .hbtn{padding:4px 7px;font-size:10px;border-radius:6px}
  .stat .n{font-size:18px}
  .stat{padding:7px 4px}
  .stat .l{font-size:9px}
  .song-card{padding:6px 8px;gap:6px}
  .song-card .sc-img{width:26px;height:26px}
  .song-card .sc-title{font-size:12px}
  .song-card .sc-acts{gap:3px}
  .act-btn{padding:3px 6px;font-size:9px}
}
</style>
</head>
<body>
<div id="login-overlay">
  <div id="login-box" class="auth-box hidden">
    <div class="lg-title">🔒 曲库管理</div>
    <div class="lg-sub">请输入管理员密码登录</div>
    <input id="login-password" type="password" placeholder="管理员密码" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="login-err"></div>
    <button onclick="doLogin()">登录</button>
    <div style="margin-top:14px;border-top:1px solid rgba(255,255,255,.08);padding-top:12px">
      <button style="background:rgba(255,255,255,.06);color:var(--cyan);border:1px solid rgba(54,217,247,.3);font-size:12px;padding:8px" onclick="skipAuth()">⚡ 免密直接进入 (本地测试)</button>
    </div>
  </div>
  <div id="setup-box" class="auth-box hidden">
    <div class="lg-title">👋 欢迎</div>
    <div class="lg-sub">首次使用，可设置密码或直接免密</div>
    <input id="setup-password" type="password" placeholder="设置密码（至少 4 位）" onkeydown="if(event.key==='Enter')document.getElementById('setup-password2').focus()">
    <input id="setup-password2" type="password" placeholder="再次输入密码" onkeydown="if(event.key==='Enter')doSetup()">
    <div id="setup-err"></div>
    <button onclick="doSetup()">设置密码并登录</button>
    <div style="margin-top:14px;border-top:1px solid rgba(255,255,255,.08);padding-top:12px">
      <button style="background:rgba(255,255,255,.06);color:var(--cyan);border:1px solid rgba(54,217,247,.3);font-size:12px;padding:8px" onclick="skipAuth()">⚡ 跳过密码，开启免密模式</button>
    </div>
  </div>
</div>

<header>
  <span class="logo">璃音K歌</span>
  <div class="spacer"></div>
  <button class="hbtn primary" onclick="doScanIncremental()">➕ 新歌</button>
  <button class="hbtn danger" onclick="doScanFull()">🔄 重扫</button>
  <button class="hbtn primary" onclick="doFetchMissingCovers()">🖼 封面</button>
  <button class="hbtn warn" onclick="doReloadAllCovers()">🖼 重下</button>
  <button class="hbtn" onclick="document.getElementById('file-input').click()">📤</button>
  <input type="file" id="file-input" multiple style="display:none" onchange="uploadFiles(this.files)">
  <button class="hbtn desktop-only" onclick="window.open('/tv','_blank')">📺</button>
  <button class="hbtn desktop-only" onclick="window.open('/mobile','_blank')">📱</button>
  <button class="hbtn" onclick="openPwModal()">🔑</button>
  <button class="hbtn" onclick="doLogout()">🚪</button>
</header>

<div id="progress-bar"><div class="pb-msg"><div class="pb-spinner"></div><span id="progress-text">就绪</span></div></div>

<main>
  <div class="stats-row">
    <div class="stat"><div class="n" id="s-total">—</div><div class="l">曲目</div></div>
    <div class="stat"><div class="n" id="s-queue">—</div><div class="l">队列</div></div>
    <div class="stat"><div class="n" id="s-plays">—</div><div class="l">累计播放</div></div>
  </div>

  <div id="upload-zone" onclick="document.getElementById('file-input').click()"
    ondragover="this.classList.add('drag');return false"
    ondragleave="this.classList.remove('drag')"
    ondrop="this.classList.remove('drag');uploadFiles(event.dataTransfer.files);return false">
    <div class="uz-icon">📤</div>
    <div class="uz-text">点击或拖拽视频到此处上传</div>
    <div class="uz-types">mp4 / mkv / avi / flv / mov / webm / mpg</div>
    <div id="upload-progress"></div>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <span>🔍</span>
      <input id="search" placeholder="搜索歌名/歌手…">
    </div>
    <button class="hbtn" id="sel-btn" style="background:var(--accent);color:#fff;border:none;flex-shrink:0" onclick="selectAll()">☐ 全选</button>
    <button class="hbtn primary" style="flex-shrink:0" onclick="batchGenerateAcc()">🎵 伴奏</button>
  </div>
  <div id="acc-status" style="display:none;margin-bottom:8px;font-size:12px;color:var(--accent2)"></div>

  <div id="song-list"></div>
  <div class="empty" id="empty-tip" style="display:none">暂无歌曲，请上传或扫描曲库</div>
</main>

<!-- Edit modal -->
<div id="modal-overlay" onclick="closeModal()">
  <div id="modal" onclick="event.stopPropagation()">
    <h3>✏️ 编辑歌曲</h3>
    <div class="form-row"><label>歌名</label><input id="edit-title"></div>
    <div class="form-row"><label>歌手（多歌手用 / 分隔）</label><input id="edit-artist" placeholder="歌手"></div>
    <input type="hidden" id="edit-id">
    <div class="modal-btns">
      <button class="hbtn" onclick="closeModal()">取消</button>
      <button class="hbtn primary" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<!-- Pw modal -->
<div id="pw-modal-overlay" onclick="closePwModal()">
  <div id="pw-modal" onclick="event.stopPropagation()">
    <h3>🔑 密码与安全</h3>
    <div class="form-row"><label>当前密码</label><input id="pw-old" type="password"></div>
    <div class="form-row"><label>新密码</label><input id="pw-new" type="password" placeholder="至少 4 位"></div>
    <div class="form-row"><label>确认新密码</label><input id="pw-new2" type="password"></div>
    <div id="pw-err"></div>
    <div class="modal-btns" style="justify-content:space-between">
      <button class="hbtn warn" onclick="disableAuthFromModal()" style="font-size:11px">⚡ 切换为免密模式</button>
      <div style="display:flex;gap:6px">
        <button class="hbtn" onclick="closePwModal()">取消</button>
        <button class="hbtn primary" onclick="submitChangePassword()">保存</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let allSongs=[];

// ── Auth ──
async function checkSession(){
  try{const r=await fetch('/api/admin/session');const d=await r.json();
    if(d.authed || d.authDisabled)showApp();else if(!d.passwordSet)showSetup();else showLogin();}
  catch(e){showLogin();}
}
function showLogin(){document.getElementById('login-overlay').classList.remove('hidden');document.getElementById('setup-box').classList.add('hidden');document.getElementById('login-box').classList.remove('hidden');}
function showSetup(){document.getElementById('login-overlay').classList.remove('hidden');document.getElementById('login-box').classList.add('hidden');document.getElementById('setup-box').classList.remove('hidden');}
function showApp(){document.getElementById('login-overlay').classList.add('hidden');loadAll();}

async function skipAuth(){
  try {
    const r = await fetch('/api/admin/disable-auth', { method: 'POST' });
    if(r.ok) {
      showApp();
      toast('⚡ 已开启免密模式，后续进入无需密码');
    }
  } catch(e) {
    showApp();
  }
}

async function disableAuthFromModal(){
  if(!confirm('确认关闭密码保护，切换为免密模式？关闭后局域网内任意设备均可直接进入曲库管理。')) return;
  const r = await fetch('/api/admin/disable-auth', { method: 'POST' });
  if(r.ok) {
    closePwModal();
    toast('⚡ 已切换为免密模式');
  }
}

async function doSetup(){
  const p1=document.getElementById('setup-password').value,p2=document.getElementById('setup-password2').value,err=document.getElementById('setup-err');
  err.textContent='';if(!p1||p1.length<4){err.textContent='密码至少 4 位';return;}if(p1!==p2){err.textContent='两次输入不一致';return;}
  const r=await fetch('/api/admin/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p1})});
  if(r.ok){document.getElementById('setup-password').value='';document.getElementById('setup-password2').value='';showApp();}
  else{const d=await r.json().catch(()=>({}));if(r.status===409)showLogin();else err.textContent=d.error||'设置失败';}
}
async function doLogin(){
  const pw=document.getElementById('login-password').value,err=document.getElementById('login-err');
  err.textContent='';if(!pw){err.textContent='请输入密码';return;}
  const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
  if(r.ok){document.getElementById('login-password').value='';showApp();}
  else{const d=await r.json().catch(()=>({}));err.textContent=d.error||'密码错误';}
}
async function doLogout(){
  const sess = await fetch('/api/admin/session').then(r=>r.json()).catch(()=>({}));
  if(sess.authDisabled){
    toast('⚡ 当前处于免密模式，无需退出');
    return;
  }
  await fetch('/api/admin/logout',{method:'POST'}).catch(()=>{});
  showLogin();
}

function openPwModal(){document.getElementById('pw-old').value='';document.getElementById('pw-new').value='';document.getElementById('pw-new2').value='';document.getElementById('pw-err').textContent='';document.getElementById('pw-modal-overlay').classList.add('open');}
function closePwModal(){document.getElementById('pw-modal-overlay').classList.remove('open');}
async function submitChangePassword(){
  const o=document.getElementById('pw-old').value,n=document.getElementById('pw-new').value,n2=document.getElementById('pw-new2').value,err=document.getElementById('pw-err');
  err.textContent='';if(!o){err.textContent='请输入当前密码';return;}if(!n||n.length<4){err.textContent='新密码至少 4 位';return;}if(n!==n2){err.textContent='两次输入不一致';return;}
  const r=await fetch('/api/admin/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({oldPassword:o,newPassword:n})});
  if(r.ok){closePwModal();toast('密码已修改');}else{const d=await r.json().catch(()=>({}));err.textContent=d.error||'修改失败';}
}

// ── Progress bar ──
function showProgress(msg){const p=document.getElementById('progress-bar');p.classList.add('show');document.getElementById('progress-text').textContent=msg;}
function hideProgress(){document.getElementById('progress-bar').classList.remove('show');}

// ── Data ──
async function loadAll(){
  const[stats,songs]=await Promise.all([fetch('/api/stats').then(r=>r.json()),fetch('/api/songs').then(r=>r.json())]);
  document.getElementById('s-total').textContent=stats.songCount;document.getElementById('s-queue').textContent=stats.queueCount;
  allSongs=songs;document.getElementById('s-plays').textContent=songs.reduce((a,s)=>a+s.play_count,0);
  render(songs);
}
function render(list){
  const el=document.getElementById('song-list'),emp=document.getElementById('empty-tip');
  el.innerHTML='';emp.style.display=list.length?'none':'block';
  list.forEach((s,i)=>{
    const d=document.createElement('div');d.className='song-card';d.dataset.id=s.id;
    d.innerHTML=`<input type="checkbox" class="sc-cb" value="${s.id}" checked>
      <img src="/api/cover/${s.id}" class="sc-img" onerror="this.style.display='none'">
      <div class="sc-info"><div class="sc-title">${esc(s.title)}</div>
      <div class="sc-meta"><span>${esc(s.artist||'未知歌手')}</span><span>▶ ${s.play_count}</span>${s.accompaniment_valid?'<span style="color:var(--accent2)">🎵伴奏</span>':''}</div></div>
      <div class="sc-acts"><button class="act-btn act-edit" onclick="openEdit(${s.id},'${esc(s.title)}','${esc(s.artist||'')}')">编辑</button>
      <button class="act-btn" style="background:rgba(54,217,247,.15);color:var(--accent2)" onclick="uploadAcc(${s.id})">🎵</button>
      <button class="act-btn" style="background:rgba(247,154,54,.15);color:var(--orange)" onclick="fetchCover(${s.id})">🖼</button>
      <button class="act-btn act-del" onclick="delSong(${s.id})">×</button></div>`;
    el.appendChild(d);
  });
}
let searchTimer;
document.getElementById('search').addEventListener('input',function(){
  clearTimeout(searchTimer);const q=this.value.trim();
  searchTimer=setTimeout(async()=>{if(!q){render(allSongs);return;}const r=await fetch('/api/songs?q='+encodeURIComponent(q));render(await r.json());},200);
});

async function delSong(id){
  if(!confirm('确认移除这首歌？'))return;
  const r=await fetch('/api/songs/'+id,{method:'DELETE'});if(r.status===401){showLogin();return;}
  document.querySelector('.song-card[data-id="'+id+'"]')?.remove();allSongs=allSongs.filter(s=>s.id!==id);
  document.getElementById('s-total').textContent=allSongs.length;toast('已移除');
}
function openEdit(id,title,artist){
  document.getElementById('edit-id').value=id;document.getElementById('edit-title').value=title;
  document.getElementById('edit-artist').value=artist||'';
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}
async function saveEdit(){
  const id=document.getElementById('edit-id').value,title=document.getElementById('edit-title').value.trim();
  const artist=document.getElementById('edit-artist').value.trim();
  if(!title){toast('歌名不能为空');return;}
  const r=await fetch('/api/songs/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,artist})});
  if(r.status===401){closeModal();showLogin();return;}
  closeModal();const s=allSongs.find(x=>x.id==Number(id));if(s){s.title=title;s.artist=artist;}
  const card=document.querySelector('.song-card[data-id="'+id+'"]');if(card){card.querySelector('.sc-title').textContent=title;card.querySelector('.sc-meta').innerHTML='<span>'+esc(artist||'未知歌手')+'</span><span>▶ '+(s?s.play_count:'')+'</span>';}
  toast('已保存');
}

// ── Scan ──
async function doScanIncremental(){
  showProgress('扫描新歌中…');
  try{
    const r=await fetch('/api/scan',{method:'POST'});const d=await r.json();
    hideProgress();toast('新增 '+d.added+' 首，共 '+d.total+' 首');loadAll();
  }catch(e){hideProgress();toast('扫描失败: '+e.message);}
}
async function doScanFull(){
  if(!confirm('⚠️ 全量重扫将清空所有歌曲记录和HLS缓存，确定要重新扫描吗？'))return;
  showProgress('全量重新扫描中…');
  try{
    const r=await fetch('/api/scan/rescan',{method:'POST'});const d=await r.json();
    if(r.status===401){hideProgress();showLogin();return;}
    hideProgress();toast('重扫完成，共 '+d.total+' 首');loadAll();
  }catch(e){hideProgress();toast('重扫失败: '+e.message);}
}

// ── Covers ──
async function doFetchMissingCovers(){
  showProgress('补全封面中…');
  try{
    const r=await fetch('/api/cover/fetch-all',{method:'POST'});const d=await r.json();
    if(r.status===401){hideProgress();showLogin();return;}
    hideProgress();toast('封面完成: '+d.ok+'/'+d.total+'（搜不到的已跳过）');loadAll();
  }catch(e){hideProgress();toast('请求失败: '+e.message);}
}
async function doReloadAllCovers(){
  if(!confirm('⚠️ 将强制重新下载所有歌曲的封面（覆盖本地文件），确定吗？'))return;
  showProgress('重下封面中（每首约3-5秒）…');
  try{
    const r=await fetch('/api/cover/reload-all',{method:'POST'});const d=await r.json();
    if(r.status===401){hideProgress();showLogin();return;}
    hideProgress();toast('重下完成: '+d.ok+'/'+d.total);loadAll();
  }catch(e){hideProgress();toast('请求失败: '+e.message);}

// ── Upload ──
async function uploadFiles(files){
  if(!files||!files.length)return;
  const prog=document.getElementById('upload-progress');prog.style.display='block';prog.style.width='0%';
  showProgress('上传中…');
  let ok=0;
  for(let i=0;i<files.length;i++){
    const f=files[i];if(!/\.(mp4|mkv|avi|flv|mov|webm|mpg)$/i.test(f.name))continue;
    const fd=new FormData();fd.append('file',f);
    try{
      const r=await fetch('/api/upload',{method:'POST',body:fd});
      if(r.ok)ok++;else{const d=await r.json().catch(()=>({}));toast(f.name+': '+(d.error||'上传失败'));}
    }catch(e){toast(f.name+': 网络错误');}
    prog.style.width=Math.round((i+1)/files.length*100)+'%';
  }
  prog.style.display='none';prog.style.width='0%';
  hideProgress();
  if(ok>0){toast('上传完成，'+ok+' 个文件，正在扫描…');await fetch('/api/scan',{method:'POST'});loadAll();}
}

async function uploadAcc(songId){
  var inp=document.createElement('input');
  inp.type='file';inp.accept='.mp3,.aac,.m4a,.wav,.flac,.ogg';
  inp.onchange=async function(){
    if(!inp.files||!inp.files[0])return;
    var fd=new FormData();fd.append('file',inp.files[0]);
    try{
      var r=await fetch('/api/upload/accompaniment/'+songId,{method:'POST',body:fd});
      if(r.ok){toast('伴奏上传成功 ✓');loadAll();}else{var d=await r.json();toast(d.error||'上传失败');}
    }catch(e){toast('网络错误');}
  };
  inp.click();
}

// ── Batch selection (all checkboxes enabled, all default checked) ──
function selectAll(){
  var cbs=document.querySelectorAll('.sc-cb'),on=!cbs[0]||!cbs[0].checked;
  cbs.forEach(c=>c.checked=on);
  document.getElementById('sel-btn').textContent=on?'☑ 取消全选':'☐ 全选';
}
async function batchGenerateAcc(){
  var cbs=document.querySelectorAll('.sc-cb:checked'),ids=[];
  cbs.forEach(c=>ids.push(Number(c.value)));
  if(!ids.length){toast('请先选择歌曲');return;}
  var status=document.getElementById('acc-status');
  status.style.display='block';status.textContent='🎵 正在后台生成伴奏... 已发送 '+ids.length+' 首';
  try{
    var r=await fetch('/api/accompaniment/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})});
    var d=await r.json();
    if(r.status===401){showLogin();return;}
    var started=d.results.filter(x=>x.status==='started').length;
    var skipped=d.results.filter(x=>x.status==='skipped').length;
    status.textContent='✅ 已提交 '+started+' 首，跳过 '+skipped+' 首，生成完成后自动更新';
    pollAccStatus();
  }catch(e){status.textContent='❌ 请求失败: '+e.message;}
}
async function pollAccStatus(){
  try{
    var r=await fetch('/api/accompaniment/status');
    var d=await r.json();
    if(r.status===401)return;
    var el=document.getElementById('acc-status');
    if(d.running&&d.running.length){
      var lines=[];
      for(var id of d.running){
        var p=d.progress[id];
        if(p)lines.push('ID '+id+': '+p.status+(p.pct>0?' '+p.pct+'%':''));
      }
      el.innerHTML='🎵 正在生成伴奏... 剩余 '+d.count+' 首<br><span style="font-size:10px;color:var(--sub)">'+lines.join('<br>')+'</span>';
      setTimeout(pollAccStatus,3000);
    }else{
      el.innerHTML='✅ 伴奏生成全部完成！';
      loadAll();
      setTimeout(()=>{el.style.display='none';el.innerHTML='';},5000);
    }
  }catch(e){}
}

async function fetchCover(id){
  var btn=event.target;btn.textContent='⏳';
  try{
    var r=await fetch('/api/cover/fetch/'+id,{method:'POST'});
    var d=await r.json();
    if(d.ok){toast('封面已下载 ✓');}else{toast('未找到封面');}
  }catch(e){toast('请求失败');}
  btn.innerHTML='🖼';
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/'/g,'&#39;');}

checkSession();
</script>
